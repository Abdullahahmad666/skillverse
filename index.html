<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillVerse — learn any skill, with people learning beside you</title>
    <meta
      name="description"
      content="Curated step-by-step roadmaps for Web Development, Python, and UX Design — vetted free resources, real projects, streaks, and a cohort that starts with you. Free forever."
    />
    <meta name="theme-color" content="#173B33" />
    <!-- Canonical URL (update if you move to a custom domain). -->
    <link rel="canonical" href="https://skillverse-wu2i.vercel.app/" />
    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillverse-wu2i.vercel.app/" />
    <meta property="og:site_name" content="SkillVerse" />
    <meta property="og:title" content="SkillVerse — learn any skill, with people learning beside you" />
    <meta
      property="og:description"
      content="Curated roadmaps, real projects, streaks with grace, and monthly cohorts. Stop collecting tutorials — start finishing them."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SkillVerse — guided, social skill learning" />
    <meta
      name="twitter:description"
      content="Curated roadmaps, real projects, streaks, and monthly cohorts. Free forever."
    />
    <script>
      // Apply the theme before first paint to avoid a flash. Dark is the
      // default (matches the dark landing page); only an explicit "light"
      // choice opts out. Must stay in sync with initialTheme() in ThemeContext.
      try {
        if (localStorage.getItem("sv-theme") !== "light") {
          document.documentElement.classList.add("dark");
        }
        // The landing (and /about) is always cosmic-dark regardless of theme.
        // Detect it before paint — "/" is the landing only when logged out
        // (no Supabase auth token in storage) — and mark it so the boot styles
        // paint a dark <html> canvas, killing the occasional white flash that
        // slips in before the <body> background rule applies.
        var loggedIn = false;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.slice(0, 3) === "sb-" && k.indexOf("-auth-token") !== -1) {
            loggedIn = true;
            break;
          }
        }
        var path = location.pathname;
        if (path === "/about" || (path === "/" && !loggedIn)) {
          document.documentElement.classList.add("landing-boot");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <!-- Critical inline styles: paint the correct background BEFORE the CSS
         bundle loads, so a hard reload never flashes white. Must live on
         <body>, NOT <html>: a background on <html> stops the body-background
         from propagating to the canvas, which would paint over the -z-10
         starfield and hide the galaxy. Mirrors --c-paper per theme (index.css). -->
    <style>
      body { margin: 0; background-color: #f4f7f5; }
      html.dark body { background-color: #080f0d; }
      /* Landing is always cosmic-dark. Paint the dark bg on <html> (the canvas,
         rendered on the very first frame — the most reliable way to kill the
         intermittent white flash) and keep <body> transparent so it never
         covers the -z-10 starfield. Cleared once React mounts (Landing.tsx). */
      html.landing-boot { background-color: #050b09; }
      html.landing-boot body { background-color: transparent; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
